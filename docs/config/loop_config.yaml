# Loop Engineering Configuration

orchestration:
  max_concurrent_loops: 5
  default_timeout: 3600
  retry_attempts: 3
  enable_monitoring: true
  log_level: "INFO"

memory:
  backend: "sqlite"
  connection_string: "sqlite:///loop_state.db"
  cache_ttl: 300
  backup_enabled: true
  backup_interval: 3600

scheduler:
  backend: "apscheduler"
  max_workers: 10
  check_interval: 60
  enable_event_triggers: true

agents:
  # Maker/Checker model separation
  # The article emphasizes: "The model that wrote the code is way too nice 
  # grading its own homework." Use different models or at least different
  # temperature settings for implementer vs verifier.
  
  explorer:
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1000
    timeout: 120
    retry_attempts: 2
    role: "explorer"
    tools:
      - "read_file"
      - "search_code"
      - "analyze_dependencies"
  
  implementer:  # MAKER
    model: "gpt-4o"  # Standard maker model
    temperature: 0.3
    max_tokens: 4000
    timeout: 300
    retry_attempts: 3
    role: "implementer"
    tools:
      - "write_file"
      - "edit_file"
      - "run_tests"
      - "create_commit"
  
  verifier:  # CHECKER
    model: "gpt-4o"  # Can be same or stronger than maker
    temperature: 0.0  # Lower temperature for consistent verification
    max_tokens: 2000
    timeout: 180
    retry_attempts: 2
    role: "verifier"
    # IMPORTANT: Verifier should NOT see implementer's reasoning
    # Only pass: code_changes, test_results, original_task description
    context_isolation: true
    tools:
      - "run_tests"
      - "lint_code"
      - "check_security"
      - "verify_dependencies"
  
  triage:
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 1000
    timeout: 60
    retry_attempts: 1
    role: "triage"
    tools:
      - "read_issues"
      - "analyze_logs"
      - "classify_priority"

# Model selection based on task complexity
model_selection:
  simple:
    explorer: "gpt-4o-mini"
    implementer: "gpt-4o-mini"
    verifier: "gpt-4o"
    triage: "gpt-4o-mini"
  medium:
    explorer: "gpt-4o-mini"
    implementer: "gpt-4o"
    verifier: "gpt-4o"
    triage: "gpt-4o-mini"
  complex:
    explorer: "gpt-4o"
    implementer: "gpt-4o"
    verifier: "gpt-4o"
    triage: "gpt-4o"
  critical:
    explorer: "gpt-4o"
    implementer: "gpt-4o"
    verifier: "gpt-4o"  # Or claude-3-opus for extra scrutiny
    triage: "gpt-4o"

worktrees:
  base_path: "./worktrees"
  auto_cleanup: true
  max_age_hours: 24
  max_concurrent: 10
  cleanup_interval: 3600

plugins:
  directory: "./plugins"
  enabled:
    - "github"
    - "linear"
    - "slack"
  auto_load: true
  hot_reload: false

skills:
  directory: "./skills"
  auto_discover: true
  cache_skills: true
  max_skill_size: 1048576  # 1MB

monitoring:
  enable_metrics: true
  metrics_port: 9090
  enable_tracing: true
  trace_sample_rate: 0.1
  enable_logging: true
  log_format: "json"

security:
  enable_secrets_management: true
  secrets_backend: "env"  # env, file, vault, aws
  enable_audit_logging: true
  max_concurrent_agents: 20
  
  # Prompt injection defense
  injection_protection:
    enabled: true
    block_on_detection: true
    log_attempts: true
  
  # Code execution sandboxing
  sandbox:
    enabled: true
    timeout_seconds: 30
    max_memory_mb: 256
    blocked_modules:
      - "subprocess"
      - "os"
      - "sys"
      - "shutil"
      - "socket"
      - "http"
      - "requests"
  
  # Input/output filtering
  io_filtering:
    redact_secrets: true
    redact_pii: true
    redact_internal_paths: true
    max_input_length: 10000
  
  # Access control
  access_control:
    enabled: true
    default_policy: "read_only"
    require_auth: true
  
  # Network security
  network:
    allowed_domains:
      - "api.openai.com"
      - "api.anthropic.com"
      - "github.com"
      - "api.github.com"
    blocked_ips:
      - "0.0.0.0"
    rate_limit_per_minute: 60

performance:
  enable_connection_pooling: true
  max_pool_size: 20
  enable_caching: true
  cache_backend: "redis"
  cache_connection_string: "redis://localhost:6379"

development:
  debug_mode: false
  enable_profiling: false
  profiling_output: "./profiles"
  enable_hot_reloading: false
