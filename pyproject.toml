[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loop-engineering"
version = "0.1.0"
description = "Automated AI agent orchestration - stop prompting, start designing systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Loop Engineering Team" },
]
keywords = ["ai", "agents", "orchestration", "automation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
auto-fix = "examples.auto_fix_issues:main"
code-quality = "examples.code_quality:main"
pr-review = "examples.pr_review:main"

[project.urls]
Homepage = "https://github.com/sayedtenkanen/loop-i-do"
Repository = "https://github.com/sayedtenkanen/loop-i-do"
Issues = "https://github.com/sayedtenkanen/loop-i-do/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
